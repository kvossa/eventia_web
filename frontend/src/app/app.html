<app-header />

<main class="main">
  <router-outlet />
</main>

<app-footer />

<div class="toast-stack" aria-live="polite">
  @for (t of toast.toasts(); track t.id) {
    <button type="button" class="toast" [class]="t.type" (click)="toast.dismiss(t.id)">
      {{ t.message }}
    </button>
  }
</div>
