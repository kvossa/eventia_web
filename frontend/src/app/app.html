<app-header />

<main class="main">
  <router-outlet />
</main>

<app-footer />

<div class="toast-stack">
  @for (t of toast.toasts(); track t.id) {
    <div
      class="toast"
      [class]="t.type"
      role="status"
      (click)="toast.dismiss(t.id)"
    >
      {{ t.message }}
    </div>
  }
</div>
